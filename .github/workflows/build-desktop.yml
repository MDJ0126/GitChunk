name: Build Git Chunk
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build Windows GUI
        run: dotnet publish Tools/GitChunk/GitChunk.csproj -c Release -r win-x64 -o publish/windows
      - name: Test Windows data and Git
        shell: pwsh
        run: |
          Copy-Item publish/windows/GitChunk.exe GitChunk.exe -Force
          ./Tools/GitChunk/Test-Unified.ps1
          ./Tools/GitChunk/Test-Git.ps1
          ./Tools/GitChunk/Test-Lfs.ps1
          python Tools/GitChunk/Test-Rules.py GitChunk.exe
          python Tools/GitChunk/Test-Identity.py GitChunk.exe
      - uses: actions/upload-artifact@v4
        with:
          name: GitChunk-Windows
          path: publish/windows/GitChunk.exe
  mac:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-latest
          - rid: osx-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build macOS app
        run: bash Tools/GitChunk/Mac/Build.sh ${{ matrix.rid }}
      - name: Test native Mac core
        run: |
          python3 Tools/GitChunk/Mac/Test.py "Tools/GitChunk/bin/mac/${{ matrix.rid }}/GitChunk.app/Contents/MacOS/GitChunk-cli"
          python3 Tools/GitChunk/Test-Rules.py "Tools/GitChunk/bin/mac/${{ matrix.rid }}/GitChunk.app/Contents/MacOS/GitChunk-cli"
          python3 Tools/GitChunk/Test-Identity.py "Tools/GitChunk/bin/mac/${{ matrix.rid }}/GitChunk.app/Contents/MacOS/GitChunk-cli"
      - uses: actions/upload-artifact@v4
        with:
          name: GitChunk-Mac-${{ matrix.rid }}
          path: Tools/GitChunk/bin/mac/${{ matrix.rid }}/GitChunk-${{ matrix.rid }}.zip
